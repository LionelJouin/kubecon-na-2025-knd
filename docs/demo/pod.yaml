---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: high-perf-net-claim
spec:
  spec:
    devices:
      requests:
      - name: high-perf-net-claim
        exactly:
          deviceClassName: dummy
          allocationMode: ExactCount
          count: 1
          selectors:
          - cel:
              expression: device.attributes["kubecon-na-2025-knd.example.com"].mtu >= 9000
---
apiVersion: v1
kind: Pod
metadata:
  name: demo
  labels:
    app: demo
spec:
  containers:
  - name: alpine
    image: alpine:latest
    imagePullPolicy: IfNotPresent
    command:
    - sleep
    - infinity
  resourceClaims:
  - name: high-perf-net-claim
    resourceClaimTemplateName: high-perf-net-claim
